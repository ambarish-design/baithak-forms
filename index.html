<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baithak Foundation — Forms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --maroon:#7a1f3d; --maroon-dark:#5c1730;
    --gold:#c9992f; --gold-light:#e7c374;
    --cream:#fdf7ec; --ink:#33241f; --ink-soft:#7a655e; --border:#ecdfc9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; font-family:'Inter', system-ui, sans-serif; color:var(--ink);
    background:
      radial-gradient(1200px 600px at 10% -10%, #f4e3c1 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, #f1cfd4 0%, transparent 50%),
      var(--cream);
    display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  .wrap{width:100%; max-width:640px;}
  .eyebrow{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--maroon); font-weight:600; margin:0 0 8px;}
  h1{font-family:'Playfair Display', serif; font-size:30px; margin:0 0 10px; color:var(--maroon-dark);}
  p.lead{color:var(--ink-soft); font-size:14.5px; line-height:1.6; margin:0 0 28px; max-width:52ch;}
  ul{list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:12px;}
  a.form-link{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 20px; border-radius:16px; border:1.5px solid var(--border);
    background:#fffdf9; text-decoration:none; color:var(--ink);
    box-shadow:0 10px 24px -18px rgba(122,31,61,.35);
    transition:border-color .15s ease, transform .1s ease;
  }
  a.form-link:hover{border-color:var(--gold); transform:translateY(-1px);}
  .form-name{font-weight:600; font-size:15px;}
  .form-type{font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); font-weight:700; margin-top:2px;}
  .arrow{color:var(--maroon); font-size:18px;}
  footer{text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:28px;}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Baithak Foundation</p>
  <h1>Forms</h1>
  <p class="lead">Surveys and feedback forms for the classical performing arts community. All responses are collected anonymously.</p>
  <ul>
    <li>
      <a class="form-link" href="/artist-survey/">
        <span>
          <div class="form-name">Anonymous Survey for Classical Musicians &amp; Dancers</div>
          <div class="form-type">Survey</div>
        </span>
        <span class="arrow">→</span>
      </a>
    </li>
  </ul>
  <footer>More forms will appear here as they're added.</footer>
</div>
</body>
</html>
